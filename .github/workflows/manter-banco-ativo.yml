name: Manter banco do ranking ativo
# O plano gratuito do Supabase pausa projetos com pouco uso.
# O Supabase recomenda algumas consultas por dia; esta rotina consulta o banco 4 vezes ao dia.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar ranking
        run: |
          set -a; . ./.env.production; set +a
          curl -fsS -m 30 -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/get_ranking" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"p_exam":"01","p_limit":1}'
          curl -fsS -m 30 -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/candidate_attempts" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d '{"p_name":"mateus"}' > /dev/null
